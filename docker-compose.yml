# ==============================================================================
# Docker Compose for AWS EC2 Deployment (Interactive Video Study Guide Backend)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Redis Message Broker & Cache
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: studyguide-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. FastAPI Backend API Server
  # ----------------------------------------------------------------------------
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: studyguide-backend:latest
    container_name: studyguide-fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/tmp:/app/backend/tmp
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # ----------------------------------------------------------------------------
  # 3. Celery Async Task Worker
  # ----------------------------------------------------------------------------
  celery_worker:
    image: studyguide-backend:latest
    container_name: studyguide-celery
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/tmp:/app/backend/tmp
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      fastapi:
        condition: service_started
    # Using single concurrency for EC2 Free Tier memory safety
    command: ["celery", "-A", "backend.celery_app", "worker", "--loglevel=info", "--concurrency=1"]

volumes:
  redis_data:
